<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="/selofon-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="سیستم مدیریت کارخانه سلفون">
  <!-- iPhone: «Add to Home Screen» opens full screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="کارخانه">
  <meta name="theme-color" content="#0F1B2D">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>مدیریت کارخانه سلفون</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F1B2D; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 18px; color: #fff; font-family: Tahoma, sans-serif; }
    #loading img { width: 88px; height: 88px; border-radius: 22px; }
    #loading .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
    #loading .bar i { display: block; width: 40%; height: 100%; background: #0E7C86; animation: s 1.2s infinite ease-in-out; }
    @keyframes s { 0% { margin-right: -40%; } 100% { margin-right: 100%; } }
    /* hide the loading screen once the app has drawn itself */
    body:has(flutter-view) #loading { display: none; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>در حال بارگذاری…</div>
    <div class="bar"><i></i></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
